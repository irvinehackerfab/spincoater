[workspace]
resolver = "3"
members = ["host_tui", "linear_regression", "sc_messages"]
exclude = ["cross/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# For postcard
serde = { version = "1.0.228", default-features = false }
# For no_std serialization
postcard = { version = "1.1.3", default-features = false }
ratatui = "0.30.2"
color-eyre = "0.6.5"
crossterm = "0.29.0"
chrono = "0.4.45"
ringbuffer = "0.16.0"
thiserror = "2.0.18"
# For logging
csv = "1.4.0"
# For loading motion profile files
rfd = "0.17.2"
# For serial port enumeration
serialport = "4.9.0"
# For UART communication
serial2 = "0.2.37"
# For linear regression of RPM values and duty cycle values
linreg = "0.2.0"
static_cell = "2.1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
